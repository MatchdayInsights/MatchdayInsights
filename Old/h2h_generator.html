.field label{font-size:13px;color:#555;display:block;margin-bottom:4px}

.di{padding:8px 12px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}

.dl-btn:hover{background:#2ea84f}
.dl-btn:disabled{opacity:0.5;cursor:not-allowed}

const names=Object.keys(CLUBS).sort();

function setupAC(inp,dd,cb){
  inp.addEventListener('input',()=>{
    const q=inp.value.trim().toLowerCase();
    if(!q){dd.style.display='none';return;}
    const m=names.filter(n=>n.toLowerCase().includes(q)).slice(0,14);
    if(!m.length){dd.style.display='none';return;}
    dd.innerHTML=m.map(n=>`<div class="di" data-n="${n}"><span>${n}</span><span class="rk">#${CLUBS[n].r} · ${CLUBS[n].e}</span></div>`).join('');
    dd.style.display='block';
    dd.querySelectorAll('.di').forEach(el=>el.addEventListener('mousedown',e=>{e.preventDefault();inp.value=el.dataset.n;dd.style.display='none';cb(el.dataset.n);}));
  });
  inp.addEventListener('keydown',e=>{if(e.key==='Escape')dd.style.display='none';});
  document.addEventListener('click',e=>{if(!inp.contains(e.target)&&!dd.contains(e.target))dd.style.display='none';});
}

function chart(n1,n2,c1,c2){
  const e1=H20[n1]||[],e2=H20[n2]||[];
  const all=[...e1,...e2].filter(v=>v!==null);
  if(!all.length)return '';
  const mn=Math.min(...all)-30,mx=Math.max(...all)+30,rng=mx-mn;
  const W=860,H=160,PL=50,PR=12,PT=14,PB=32,cw=W-PL-PR,ch=H-PT-PB;
  const n=Math.max(e1.length,e2.length);
  const xp=i=>PL+(i/(n-1))*cw,yp=v=>PT+(1-(v-mn)/rng)*ch;
  function mkp(arr){const pts=arr.map((v,i)=>v!==null?`${xp(i).toFixed(1)},${yp(v).toFixed(1)}`:null).filter(Boolean);return pts.length?'M '+pts.join(' L '):'';}
  function mkf(arr){const v=arr.map((v,i)=>v!==null?[i,v]:null).filter(Boolean);if(!v.length)return'';const p=mkp(arr);return`${p} L ${xp(v[v.length-1][0]).toFixed(1)},${H-PB} L ${xp(v[0][0]).toFixed(1)},${H-PB} Z`;}
  const p1=mkp(e1),p2=mkp(e2),f1=mkf(e1),f2=mkf(e2);
  const lv1=[...e1].reverse().find(v=>v!==null),lv2=[...e2].reverse().find(v=>v!==null);
  const li1=e1.length-1-[...e1].reverse().findIndex(v=>v!==null);
  const li2=e2.length-1-[...e2].reverse().findIndex(v=>v!==null);
  const step=Math.round(rng/3/50)*50||50;let tv=Math.round(mn/step)*step;
  const tks=[];while(tv<=mx){if(tv>=mn)tks.push(tv);tv+=step;}
  const tlines=tks.map(tv=>`<line x1="${PL}" y1="${yp(tv).toFixed(1)}" x2="${W-PR}" y2="${yp(tv).toFixed(1)}" stroke="#e0e0e0" stroke-width="1"/><text x="${PL-5}" y="${(yp(tv)+4).toFixed(1)}" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="11" fill="#9098b8">${tv}</text>`).join('');
  const lb1=n1.split(' ').pop(),lb2=n2.split(' ').pop();
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${c1}" stop-opacity="0.12"/><stop offset="100%" stop-color="${c1}" stop-opacity="0.01"/></linearGradient>

    <path d="${p2}" fill="none" stroke="${c2}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,3"/>
    <circle cx="${xp(li1).toFixed(1)}" cy="${yp(lv1).toFixed(1)}" r="5" fill="${c1}" stroke="#fff" stroke-width="2"/>
    <text x="${(xp(li1)-8).toFixed(1)}" y="${(yp(lv1)-10).toFixed(1)}" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="12" font-weight="700" fill="${c1}">${lb1} ${lv1}</text>

}

    return s;

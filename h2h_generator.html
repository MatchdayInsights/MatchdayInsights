h1{font-size:22px;font-weight:600;margin-bottom:4px}
.sub{font-size:14px;color:#666;margin-bottom:20px}
.row{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;margin-bottom:12px}
.vs{display:flex;align-items:center;justify-content:center;height:42px;font-size:13px;color:#888;padding-top:18px}
.field label{font-size:13px;color:#555;display:block;margin-bottom:4px}
input[type=text]{width:100%;padding:8px 10px;font-size:14px;border:1px solid #ddd;border-radius:6px;outline:none}

.ac{position:relative}
.dd{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.12);z-index:100;max-height:220px;overflow-y:auto;display:none}
.di{padding:8px 12px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between}
.di:hover,.di.active{background:#f5f5f5}
.di .rk{font-size:12px;color:#888}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.btn{width:100%;padding:10px;font-size:15px;font-weight:500;background:#1a1a2e;color:#fff;border:none;border-radius:6px;cursor:pointer;margin-bottom:20px}
.btn:hover{background:#2a2a4e}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.dl-btn{width:100%;padding:10px;font-size:15px;font-weight:500;background:#3dba5e;color:#fff;border:none;border-radius:6px;cursor:pointer;margin-top:12px;display:none}.dl-btn:hover{background:#2ea84f}.dl-btn:disabled{opacity:0.5;cursor:not-allowed}

.dl-btn:hover{background:#2ea84f}
.dl-btn:disabled{opacity:0.5;cursor:not-allowed}

</div>

function setupAC(inp,dd,cb){
  inp.addEventListener('input',()=>{
    const q=inp.value.trim().toLowerCase();
    if(!q){dd.style.display='none';return;}
    const m=names.filter(n=>n.toLowerCase().includes(q)).slice(0,14);
    if(!m.length){dd.style.display='none';return;}
    dd.innerHTML=m.map(n=>`<div class="di" data-n="${n}"><span>${n}</span><span class="rk">#${CLUBS[n].r} · ${CLUBS[n].e}</span></div>`).join('');
    dd.style.display='block';
    dd.querySelectorAll('.di').forEach(el=>el.addEventListener('mousedown',e=>{e.preventDefault();inp.value=el.dataset.n;dd.style.display='none';cb(el.dataset.n);}));
  });
  inp.addEventListener('keydown',e=>{if(e.key==='Escape')dd.style.display='none';});
  document.addEventListener('click',e=>{if(!inp.contains(e.target)&&!dd.contains(e.target))dd.style.display='none';});
}

function chart(n1,n2,c1,c2){

  function mkf(arr){const v=arr.map((v,i)=>v!==null?[i,v]:null).filter(Boolean);if(!v.length)return'';const p=mkp(arr);return`${p} L ${xp(v[v.length-1][0]).toFixed(1)},${H-PB} L ${xp(v[0][0]).toFixed(1)},${H-PB} Z`;}

      ${h2v?`<div class="hb"><span class="hbl">History</span><div class="hbv">${h2v}</div></div>`:''}
    </div>
  </div>
  <div class="gbar">
    <div class="gl">
      <div class="ge">The only game that matters</div>
      <div class="gm" style="font-size:clamp(14px,2.2vw,26px)"><span style="color:${readableOnDark(c1)}">${sh1}</span> <span style="color:#7880a0;font-size:16px;font-weight:400">vs</span> <span style="color:${readableOnDark(c2)}">${sh2}</span></div>
      <div class="gs">Rating gap as of ${DATES[DATES.length-1]}</div>
    </div>
    <div class="gr">
      <div class="gn">${gap}</div>
      <div class="gu">Rating Gap</div>
    </div>
  </div>
  <div class="cw">
    <div class="cm"><span>Last 20 updates · ${dr}</span></div>
    ${chart(n1,n2,c1,c2)}
    <div class="cl">
      <div class="li"><div class="ll" style="background:${c1}"></div>${n1}</div>
      <div class="li"><div class="ll" style="background:${c2};background:repeating-linear-gradient(90deg,${c2} 0,${c2} 5px,transparent 5px,transparent 8px)"></div>${n2}</div>
    </div>
  </div>
  <div class="fb">
    <div class="fs">${footer}</div>
    <div class="fu">matchdayinsights.github.io/MatchdayInsights</div>
  </div>
  <div class="abar" style="background:linear-gradient(90deg,${c1} 50%,${c2} 50%)"></div>
</div>`;

  const dlBtn = document.getElementById('dlbtn');
  dlBtn.style.display = 'block';
  dlBtn.disabled = false;
  dlBtn.onclick = async function() {
    dlBtn.disabled = true;
    dlBtn.textContent = 'Generating PNG...';
    try {
      const el = document.getElementById('out').firstElementChild;
      const canvas = await html2canvas(el, {scale:2, useCORS:true, backgroundColor:'#f5f6f2', logging:false});
      const link = document.createElement('a');
      link.download = 'mdi_' + (n1||'team1').replace(/[^a-z0-9]/gi,'_').toLowerCase() + '_vs_' + (n2||'team2').replace(/[^a-z0-9]/gi,'_').toLowerCase() + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch(err) {
      alert('Download failed: ' + err.message);
    }
    dlBtn.disabled = false;
    dlBtn.textContent = '\u2B07 Download as PNG';
  };
});
</script>
</body>
</html>

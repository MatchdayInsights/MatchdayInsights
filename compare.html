<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Clubs | Matchday Insights</title>
<meta name="description" content="Compare any two tracked clubs side by side - rank, rating, all-time highs, and rating/ranking history.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css">
<link rel="stylesheet" href="club-page.css">
<style>
.compare-page { max-width: 1000px; margin: 0 auto; padding: 32px 32px 60px; }
.compare-title { font-size: 34px; font-weight: 900; margin-bottom: 6px; }
.compare-sub { color: var(--text2); font-size: 15px; margin-bottom: 28px; }
.picker-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: start; margin-bottom: 32px; }
.picker-vs { display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--muted); font-size: 15px; padding-top: 14px; }
.picker-wrap { position: relative; }
.picker-input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 7px; padding: 12px 14px; color: var(--text); font-family: 'Barlow Condensed', sans-serif; font-size: 17px; outline: none; }
.picker-input:focus { border-color: var(--green-dim); }
.picker-dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface2); border: 1px solid var(--border2); border-radius: 7px; max-height: 260px; overflow-y: auto; z-index: 50; display: none; }
.picker-dropdown.open { display: block; }
.picker-option { padding: 10px 14px; cursor: pointer; font-size: 15px; display: flex; justify-content: space-between; gap: 10px; }
.picker-option:hover { background: var(--surface); color: var(--green); }
.picker-option .po-rank { color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 12px; }

.compare-header { padding: 24px 0; border-bottom: 2px solid var(--green-dim); margin-bottom: 0; }
.compare-clubs-header { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: center; }
.compare-club-side { display: flex; flex-direction: column; }
.compare-club-side.right { align-items: flex-end; text-align: right; }
.compare-club-flag-name { display: flex; align-items: center; gap: 10px; }
.compare-club-flag-name.right { flex-direction: row-reverse; }
.compare-club-flag { width: 36px; height: 26px; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
.compare-club-name { font-size: clamp(20px, 3vw, 32px); font-weight: 900; text-transform: uppercase; color: var(--text); line-height: 1; }
.compare-club-league { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text2); margin-top: 6px; }
.compare-vs { font-family: 'JetBrains Mono', monospace; font-size: 16px; color: var(--muted); letter-spacing: 3px; text-align: center; }
.compare-elo { font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 600; margin-top: 10px; }
.compare-elo.left { color: var(--green); }
.compare-elo.right { color: #4a90d9; }

.compare-stats-section { padding: 20px 0; border-bottom: 1px solid var(--border); }
.compare-stat-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(24,28,36,0.5); }
.compare-stat-row:last-child { border-bottom: none; }
.compare-stat-val { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 600; color: var(--text); }
.compare-stat-val.left { text-align: left; }
.compare-stat-val.right { text-align: right; }
.compare-stat-val.winner { color: var(--green); }
.compare-stat-label { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; text-align: center; }
.compare-stat-date { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); opacity: 0.7; margin-top: 3px; }
.compare-charts { padding: 24px 0; }
.compare-empty { color: var(--text2); text-align: center; padding: 60px 20px; font-size: 16px; }
.compare-loading { color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<nav class="site-nav">
  <div class="nav-logo">
    <div class="nav-brand">Matchday Insights</div>
    <div class="nav-sub">Global Club Rankings</div>
  </div>
</nav>

<main class="compare-page">
  <a class="back-to-rankings" href="index.html">← See Full Rankings</a>
  <div class="compare-title">Compare Clubs</div>
  <div class="compare-sub">Pick any two tracked clubs to compare rank, rating, all-time highs, and rating/ranking history.</div>

  <div class="picker-row">
    <div class="picker-wrap">
      <input type="text" class="picker-input" id="picker-a" placeholder="Search club A..." autocomplete="off">
      <div class="picker-dropdown" id="dropdown-a"></div>
    </div>
    <div class="picker-vs">VS</div>
    <div class="picker-wrap">
      <input type="text" class="picker-input" id="picker-b" placeholder="Search club B..." autocomplete="off">
      <div class="picker-dropdown" id="dropdown-b"></div>
    </div>
  </div>

  <div id="compare-result">
    <div class="compare-empty">Select two clubs above to compare.</div>
  </div>
</main>

<footer class="site-footer">
  <p>© 2026 Matchday Insights</p>
</footer>

<script>
let RANKINGS = null;
let ALL_HISTORY = null;
let selected = { a: null, b: null };

async function loadRankings() {
  const res = await fetch('rankings_table.json');
  RANKINGS = await res.json();
}

async function loadAllHistory() {
  if (ALL_HISTORY) return true;
  try {
    const res = await fetch('all_history.json');
    ALL_HISTORY = await res.json();
    return true;
  } catch (e) {
    return false;
  }
}

function searchClubs(query) {
  if (!query || query.length < 2) return [];
  const q = query.toLowerCase();
  return Object.values(RANKINGS)
    .filter(c => c.club.toLowerCase().includes(q))
    .sort((a, b) => a.rank - b.rank)
    .slice(0, 8);
}

function setupPicker(side) {
  const input = document.getElementById('picker-' + side);
  const dropdown = document.getElementById('dropdown-' + side);

  input.addEventListener('input', () => {
    const results = searchClubs(input.value);
    if (results.length === 0) { dropdown.classList.remove('open'); return; }
    dropdown.innerHTML = results.map(c =>
      '<div class="picker-option" data-team-id="' + c.team_id + '">' +
        '<span>' + c.club + ' <span style="color:var(--muted);font-size:12px;">(' + c.country + ')</span></span>' +
        '<span class="po-rank">#' + c.rank + '</span>' +
      '</div>'
    ).join('');
    dropdown.classList.add('open');
  });

  dropdown.addEventListener('click', (e) => {
    const opt = e.target.closest('.picker-option');
    if (!opt) return;
    const teamId = opt.dataset.teamId;
    selected[side] = RANKINGS[teamId];
    input.value = RANKINGS[teamId].club;
    dropdown.classList.remove('open');
    renderComparison();
  });

  document.addEventListener('click', (e) => {
    if (!input.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.classList.remove('open');
    }
  });
}

function fmtDate(d) {
  if (!d) return '—';
  try {
    const parts = d.split('/');
    const dt = new Date(parts[2], parts[0] - 1, parts[1]);
    return dt.toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric'});
  } catch (e) { return d; }
}

function getFlag(countryCode) {
  const iso = (countryCode || '').toLowerCase().slice(0, 2);
  return '<span class="fi fi-' + iso + '" style="width:100%;height:100%;display:block;background-size:cover;"></span>';
}

// Ported from Classic's buildCompareChart() (Greg, 2026-08) - two
// clubs' series on the same axes, solid vs dashed line to distinguish.
function buildCompareChart(dA, dB, colorA, colorB, reverse) {
  var W = 780, H = 200, PL = 52, PR = 10, PT = 14, PB = 28;
  var cw = W - PL - PR, ch = H - PT - PB;
  var all = dA.concat(dB).filter(function(v) { return v !== null && v !== undefined; });
  if (all.length < 2) return '<div class="compare-loading">Not enough data</div>';
  var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
  var range = (mx === mn) ? 1 : (mx - mn);
  var n = Math.max(dA.length, dB.length);
  function xp(i) { return PL + (i / (n - 1)) * cw; }
  function yp(v) {
    var norm = (v - mn) / range;
    var frac = reverse ? norm : (1 - norm);
    return PT + frac * ch;
  }
  var pA = dA.map(function(v, i) { return v !== null ? xp(i).toFixed(1) + ',' + yp(v).toFixed(1) : null; }).filter(Boolean).join(' ');
  var pB = dB.map(function(v, i) { return v !== null ? xp(i).toFixed(1) + ',' + yp(v).toFixed(1) : null; }).filter(Boolean).join(' ');
  var ytH = '';
  for (var g = 0; g <= 4; g++) {
    var val = mn + (range * g / 4), gy = yp(val);
    ytH += '<line x1="' + PL + '" y1="' + gy.toFixed(1) + '" x2="' + (PL + cw) + '" y2="' + gy.toFixed(1) +
      '" stroke="#1e2330" stroke-width="1"/><text x="' + (PL - 4) + '" y="' + (gy + 4).toFixed(1) +
      '" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="12" fill="#565e78">' +
      (reverse ? '#' + Math.round(val) : Math.round(val)) + '</text>';
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block">' + ytH +
    '<polyline points="' + pA + '" fill="none" stroke="' + colorA + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<polyline points="' + pB + '" fill="none" stroke="' + colorB + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,4"/></svg>';
}

async function renderCompareCharts(teamIdA, teamIdB, clubA, clubB) {
  const chartsWrap = document.getElementById('compare-charts-wrap');
  chartsWrap.innerHTML = '<div class="compare-loading">Loading history…</div>';
  const ok = await loadAllHistory();
  if (!ok || !ALL_HISTORY[teamIdA] || !ALL_HISTORY[teamIdB]) {
    chartsWrap.innerHTML = '<div class="compare-loading">History unavailable for one or both clubs</div>';
    return;
  }
  const histA = ALL_HISTORY[teamIdA], histB = ALL_HISTORY[teamIdB];
  const n = 60; // fixed recent window - simpler than Classic's selectable timeframe, still useful
  const eloA = histA.e.slice(-n), eloB = histB.e.slice(-n);
  const rankA = histA.r.slice(-n), rankB = histB.r.slice(-n);
  const colorA = '#3dba5e', colorB = '#4a90d9';
  const legend = '<div style="display:flex;gap:20px;margin-bottom:10px;font-family:\'JetBrains Mono\',monospace;font-size:12px">' +
    '<span style="color:' + colorA + '">— ' + clubA.club + '</span>' +
    '<span style="color:' + colorB + ';margin-left:8px">┈ ' + clubB.club + '</span></div>';
  chartsWrap.innerHTML =
    '<div class="panel-title" style="margin-bottom:8px">Rating History — Last ' + eloA.length + ' Updates</div>' +
    legend + buildCompareChart(eloA, eloB, colorA, colorB, false) +
    '<div class="panel-title" style="margin:24px 0 8px">Ranking History — Last ' + rankA.length + ' Updates</div>' +
    legend + buildCompareChart(rankA, rankB, colorA, colorB, true);
}

function renderComparison() {
  const container = document.getElementById('compare-result');
  if (!selected.a || !selected.b) {
    container.innerHTML = '<div class="compare-empty">Select two clubs above to compare.</div>';
    return;
  }
  const a = selected.a, b = selected.b;

  const rows = [
    { label: 'Current Rank', a: '#' + a.rank, b: '#' + b.rank, aBetter: a.rank < b.rank, bBetter: b.rank < a.rank },
    { label: 'Current Rating', a: a.elo.toFixed(1), b: b.elo.toFixed(1), aBetter: a.elo > b.elo, bBetter: b.elo > a.elo },
    { label: 'Rating Change (This Cycle)',
      a: a.elo_change != null ? (a.elo_change > 0 ? '+' : '') + a.elo_change.toFixed(1) : 'N/R',
      b: b.elo_change != null ? (b.elo_change > 0 ? '+' : '') + b.elo_change.toFixed(1) : 'N/R',
      aBetter: (a.elo_change || 0) > (b.elo_change || 0), bBetter: (b.elo_change || 0) > (a.elo_change || 0) },
    { label: 'All-Time High Rank', a: '#' + a.all_time_high_rank, b: '#' + b.all_time_high_rank,
      aDate: fmtDate(a.all_time_high_rank_date), bDate: fmtDate(b.all_time_high_rank_date),
      aBetter: a.all_time_high_rank < b.all_time_high_rank, bBetter: b.all_time_high_rank < a.all_time_high_rank },
    { label: 'All-Time High Rating', a: a.all_time_high_elo.toFixed(1), b: b.all_time_high_elo.toFixed(1),
      aDate: fmtDate(a.all_time_high_elo_date), bDate: fmtDate(b.all_time_high_elo_date),
      aBetter: a.all_time_high_elo > b.all_time_high_elo, bBetter: b.all_time_high_elo > a.all_time_high_elo },
    { label: 'Times Ranked #1', a: a.times_no1 || 0, b: b.times_no1 || 0, aBetter: (a.times_no1||0) > (b.times_no1||0), bBetter: (b.times_no1||0) > (a.times_no1||0) },
    { label: 'Updates in Top 10', a: a.top10 || 0, b: b.top10 || 0, aBetter: (a.top10||0) > (b.top10||0), bBetter: (b.top10||0) > (a.top10||0) },
    { label: 'Updates in Top 50', a: a.top50 || 0, b: b.top50 || 0, aBetter: (a.top50||0) > (b.top50||0), bBetter: (b.top50||0) > (a.top50||0) },
  ];

  const rowsHtml = rows.map(r =>
    '<div class="compare-stat-row">' +
      '<div class="compare-stat-val left ' + (r.aBetter ? 'winner' : '') + '">' + r.a + (r.aDate ? '<div class="compare-stat-date">' + r.aDate + '</div>' : '') + '</div>' +
      '<div class="compare-stat-label">' + r.label + '</div>' +
      '<div class="compare-stat-val right ' + (r.bBetter ? 'winner' : '') + '">' + r.b + (r.bDate ? '<div class="compare-stat-date">' + r.bDate + '</div>' : '') + '</div>' +
    '</div>'
  ).join('');

  container.innerHTML =
    '<div class="compare-header">' +
      '<div class="compare-clubs-header">' +
        '<div class="compare-club-side left">' +
          '<div class="compare-club-flag-name"><div class="compare-club-flag">' + getFlag(a.country) + '</div><div class="compare-club-name">' + a.club + '</div></div>' +
          '<div class="compare-club-league">' + a.country + ' · Rank #' + a.rank + '</div>' +
          '<div class="compare-elo left">' + a.elo.toFixed(1) + '</div>' +
        '</div>' +
        '<div class="compare-vs">VS</div>' +
        '<div class="compare-club-side right">' +
          '<div class="compare-club-flag-name right"><div class="compare-club-flag">' + getFlag(b.country) + '</div><div class="compare-club-name">' + b.club + '</div></div>' +
          '<div class="compare-club-league">' + b.country + ' · Rank #' + b.rank + '</div>' +
          '<div class="compare-elo right">' + b.elo.toFixed(1) + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="compare-stats-section">' + rowsHtml + '</div>' +
    '<div class="compare-charts"><div id="compare-charts-wrap"><div class="compare-loading">Loading history…</div></div></div>';

  renderCompareCharts(a.team_id, b.team_id, a, b);
}

(async function() {
  await loadRankings();
  setupPicker('a');
  setupPicker('b');
})();
</script>
</body>
</html>
